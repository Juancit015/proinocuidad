; Límites de subida del endpoint de inscripción (solo este directorio).
; 5 MB es el máximo que admite el formulario; 6M/8M dejan margen al
; overhead del multipart sin dejar pasar archivos enormes al proceso PHP
; (un POST mayor a post_max_size llega vacío y el endpoint responde 413).
upload_max_filesize = 6M
post_max_size = 8M
